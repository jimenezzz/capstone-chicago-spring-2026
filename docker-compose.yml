services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pharma_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharma_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["core"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pharma_hub
      ENV: local
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"

  web:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"

  pipelines:
    profiles: ["pipelines"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pharma_hub
      ENV: local
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "pipelines.ingestion.cli", "--help"]

volumes:
  postgres_data:
